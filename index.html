<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oakenshire Fire & Rescue — Duty Management</title>
<style>
:root{
  --bg:#f3f5f6;--card:#fff;--ink:#20252b;--muted:#69727c;--line:#dfe4e8;
  --blue:#1769e0;--blue2:#0e58c9;--red:#d52f35;--redbg:#fff0f0;
  --green:#2f8a43;--greenbg:#eaf7ec;--amber:#b77900;--amberbg:#fff7df;
  --shadow:0 2px 10px rgba(30,42,54,.08);--radius:12px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{min-height:100vh}
.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 26px;gap:24px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;min-width:250px}
.brandmark{width:38px;height:38px;border-radius:10px;background:#1e252c;color:#fff;display:grid;place-items:center;font-size:15px;font-weight:900;letter-spacing:-1px}
.brand small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:1px}
.nav{display:flex;gap:4px;align-items:center;flex:1}
.nav button{border:0;background:transparent;color:#59636d;padding:10px 12px;border-radius:8px;font-weight:650}
.nav button.active,.nav button:hover{background:#f0f3f6;color:var(--ink)}
.userbox{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:#e9edf1;display:grid;place-items:center;font-weight:800;font-size:12px}
.userbox strong{font-size:13px}.userbox span{display:block;color:var(--muted);font-size:11px}
.page{max-width:1180px;margin:0 auto;padding:28px 22px 55px}
.pagehead{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}
h1{font-size:24px;margin:0 0 5px;letter-spacing:-.3px}h2{font-size:17px;margin:0 0 12px}h3{font-size:14px;margin:0 0 8px}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.section{margin:0 0 18px;padding:18px}
.section-title{font-size:14px;font-weight:800;margin-bottom:10px}
.appliance-list{padding:0 18px 18px}
.appliance-card{position:relative;margin-top:9px;padding:13px 12px 13px 16px;background:var(--redbg);border:1px solid #f3d9d9;border-radius:4px;display:flex;align-items:center;justify-content:space-between;gap:15px;min-height:72px;overflow:hidden}
.appliance-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
.appliance-card.partial{background:var(--amberbg);border-color:#f0e3b8}.appliance-card.partial:before{background:var(--amber)}
.appliance-card.full{background:var(--greenbg);border-color:#d7ecd9}.appliance-card.full:before{background:var(--green)}
.appliance-meta{min-width:0}.appliance-name{font-size:14px;font-weight:800}.type{font-weight:500;color:#555}
.appliance-line{font-size:12px;color:#6a727a;margin-top:2px}.crew{font-size:12px;color:#6a727a}
.btn{border:0;border-radius:8px;padding:9px 15px;font-size:12px;font-weight:750;background:var(--blue);color:#fff;white-space:nowrap}.btn:hover{background:var(--blue2)}
.btn.secondary{background:#eef1f4;color:#303941}.btn.danger{background:#fff0f0;color:#b21f27}.btn.small{padding:7px 10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat{padding:17px}.stat .num{font-size:25px;font-weight:850;margin-top:5px}.stat .label{color:var(--muted);font-size:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:6px}
input,select,textarea{width:100%;border:1px solid #d5dce1;border-radius:8px;background:#fff;padding:10px 11px;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:#8bb2ee;box-shadow:0 0 0 3px #eaf2ff}
textarea{min-height:105px;resize:vertical}
.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-weight:750}
.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800;background:#edf1f4}.badge.green{background:#e6f5e9;color:#28753a}.badge.red{background:#fff0f0;color:#a5232a}
.empty{padding:32px;text-align:center;color:var(--muted);font-size:13px}
.login-wrap{min-height:100vh;display:grid;place-items:center;background:linear-gradient(#eef1f3,#f7f8f9);padding:20px}
.login{width:min(420px,100%);padding:30px}.login-brand{text-align:center;margin-bottom:24px}.login-brand .brandmark{margin:0 auto 12px;width:52px;height:52px;font-size:18px}.login-brand h1{font-size:20px}.login-brand p{color:var(--muted);font-size:12px}
.notice{background:#f5f7f9;border:1px solid var(--line);padding:10px;border-radius:8px;font-size:11px;color:var(--muted);margin-bottom:15px}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,24,32,.42);z-index:50;display:grid;place-items:center;padding:20px}
.modal{background:#fff;width:min(780px,100%);max-height:90vh;overflow:auto;border-radius:14px;box-shadow:0 15px 60px rgba(0,0,0,.22);padding:22px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.close{border:0;background:#f1f3f5;border-radius:50%;width:32px;height:32px}
.report-row{padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px}.report-row:last-child{border-bottom:0}
.report-row strong{font-size:13px}.report-row small{display:block;color:var(--muted);margin-top:4px}
.builder{display:grid;grid-template-columns:190px 1fr 220px;gap:14px}.panel{border:1px solid var(--line);border-radius:10px;background:#fafbfc;padding:12px}
.palette-item{padding:10px;border:1px solid var(--line);border-radius:7px;background:#fff;margin-bottom:7px;font-size:12px;font-weight:700;cursor:grab}
.canvas{min-height:500px;background:#f7f9fa;border:2px dashed #d9dfe4;border-radius:10px;padding:15px}
.drop-hint{text-align:center;color:#9aa3ab;padding:35px 10px;font-size:12px}
.block{background:#fff;border:1px solid #dfe4e8;border-radius:8px;padding:12px;margin-bottom:9px;cursor:grab;position:relative}
.block.selected{border-color:#75a7ea;box-shadow:0 0 0 3px #eaf2ff}.block .block-type{font-size:9px;text-transform:uppercase;color:#8a949d;font-weight:800;margin-bottom:5px}.block label{font-size:12px;font-weight:750}
.block .preview{margin-top:7px;color:#a0a8af;font-size:11px;border:1px solid #e0e4e7;border-radius:6px;padding:8px}
.report-form{max-width:760px;margin:auto}.form-block{background:#fff;padding:15px;border:1px solid var(--line);border-radius:9px;margin-bottom:10px}.form-block label{font-size:12px;font-weight:800;display:block;margin-bottom:6px}
.image-preview{max-width:180px;max-height:120px;border-radius:7px;margin-top:8px;border:1px solid var(--line)}
.logo-img{width:38px;height:38px;border-radius:10px;object-fit:cover}.settings-logo{width:80px;height:80px;object-fit:contain;border:1px solid var(--line);border-radius:10px}
@media(max-width:900px){.topbar{padding:0 14px}.brand{min-width:auto}.brand span,.userbox>div{display:none}.builder{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}.nav{overflow:auto}.nav button{white-space:nowrap}}
@media(max-width:620px){.topbar{height:auto;min-height:62px;flex-wrap:wrap;padding:10px}.nav{order:3;flex-basis:100%}.grid2,.grid3{grid-template-columns:1fr}.page{padding:20px 12px}.appliance-card{align-items:flex-start}.pagehead{align-items:flex-start;gap:10px;flex-direction:column}}

/* Oakenshire UI polish */
.icon{width:16px;height:16px;display:inline-block;vertical-align:-3px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-lg{width:19px;height:19px}
.icon-sm{width:14px;height:14px}
button,.card,.appliance-card,.report-row,.palette-item,.block,.stat,.nav button{transition:transform .16s ease,box-shadow .16s ease,background-color .16s ease,border-color .16s ease,opacity .16s ease}
button:hover:not(:disabled){transform:translateY(-1px)}
.card{animation:fadeUp .28s ease both}
.appliance-card{animation:fadeUp .25s ease both}
.appliance-card:hover{box-shadow:0 5px 18px rgba(30,42,54,.10);transform:translateY(-1px)}
.report-row:hover{background:#fafbfc}
.palette-item:hover{border-color:#b9cbe0;box-shadow:0 4px 12px rgba(30,42,54,.07);transform:translateY(-1px)}
.block:hover{box-shadow:0 4px 14px rgba(30,42,54,.07)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px}
.nav button{display:inline-flex;align-items:center;gap:7px}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:scale(1);opacity:1}}
.modal-backdrop{animation:fadeIn .16s ease}
.modal{animation:pop .18s ease}
.toast{position:fixed;right:22px;bottom:22px;z-index:100;background:#20262c;color:#fff;padding:11px 14px;border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.2);font-size:12px;animation:toastIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.builder{grid-template-columns:180px 1fr 235px}
.canvas{position:relative;overflow:auto}
.canvas-toolbar{display:flex;gap:7px;align-items:center;justify-content:space-between;margin-bottom:10px}
.canvas-stage{background:#fff;border:1px solid #e0e5e9;border-radius:10px;min-height:620px;padding:22px;position:relative}
.canvas-stage.grid-bg{background-image:linear-gradient(#f0f3f5 1px,transparent 1px),linear-gradient(90deg,#f0f3f5 1px,transparent 1px);background-size:20px 20px}
.block.dragging{opacity:.35}
.block .move-handle{position:absolute;right:8px;top:8px;color:#a0a8af;font-size:13px}
.logo-block{display:flex;align-items:center;justify-content:center;min-height:65px;border:1px dashed #cfd7de;border-radius:8px;padding:10px;background:#fff}
.logo-block img{max-width:100%;max-height:110px;object-fit:contain}
.builder-note{font-size:10px;color:#7c8790;line-height:1.45}
.template-actions{display:flex;gap:7px;flex-wrap:wrap}
.report-editor-field{border:1px solid var(--line);padding:10px;border-radius:8px;margin-bottom:8px;background:#fff}
.report-editor-field.selected{border-color:#75a7ea;box-shadow:0 0 0 3px #eaf2ff}
.text-insert{border:1px dashed #cdd5dc;background:#fafcfd;border-radius:7px;padding:9px;font-size:12px;cursor:text}
.image-drop{border:1px dashed #cdd5dc;background:#fafcfd;border-radius:7px;padding:14px;text-align:center;color:#8b959e;font-size:11px}

</style>
</head>
<body>
<div id="root"></div>
<div id="modalRoot"></div>
<script>
const KEY='oakenshire_prototype_v2';
const today=()=>new Date().toISOString().slice(0,10);
const prettyDate=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const uid=()=>Math.random().toString(36).slice(2,10);
const ICONS={
  grid:`<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>`,
  truck:`<svg class="icon" viewBox="0 0 24 24"><path d="M3 6h11v11H3z"/><path d="M14 10h4l3 3v4h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>`,
  report:`<svg class="icon" viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v4h4M9 12h6M9 16h6M9 8h2"/></svg>`,
  user:`<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 3.5-6 8-6s7.2 2 8 6"/></svg>`,
  settings:`<svg class="icon" viewBox="0 0 24 24"><path d="M12 3l1.4 2.8 3.1.5.9 3-2.2 2.2.5 3.1-2.8 1.4-2.8-1.4.5-3.1-2.2-2.2.9-3 3.1-.5z"/><circle cx="12" cy="12" r="2.5"/></svg>`,
  plus:`<svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>`,
  logout:`<svg class="icon" viewBox="0 0 24 24"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/></svg>`,
  edit:`<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13 6l4 4"/></svg>`,
  trash:`<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>`,
  upload:`<svg class="icon" viewBox="0 0 24 24"><path d="M12 16V4M8 8l4-4 4 4M5 20h14"/></svg>`,
  save:`<svg class="icon" viewBox="0 0 24 24"><path d="M5 4h12l2 2v14H5zM8 4v5h8V4M9 20v-6h6v6"/></svg>`,
  close:`<svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  drag:`<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 5h.01M15 5h.01M9 12h.01M15 12h.01M9 19h.01M15 19h.01"/></svg>`,
  image:`<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="M4 17l5-5 3 3 2-2 6 5"/></svg>`,
  text:`<svg class="icon" viewBox="0 0 24 24"><path d="M5 5h14M12 5v14M8 19h8"/></svg>`,
  form:`<svg class="icon" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg>`,
  check:`<svg class="icon" viewBox="0 0 24 24"><path d="M5 12l4 4L19 6"/></svg>`,
  fire:`<svg class="icon" viewBox="0 0 24 24"><path d="M12 21c4 0 7-2.8 7-7 0-3.3-2.2-5.7-4.7-8.4.1 2.5-1.2 3.8-2.3 4.6.2-3.5-1.3-5.8-3.7-7.2.2 2.8-3.3 5.4-3.3 9.4 0 4.8 3.2 8.6 7 8.6z"/></svg>`
};
function toast(msg){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}

const defaultState={
  users:[
    {id:'u-admin',username:'admin',password:'admin123',role:'admin'},
    {id:'u-matt',username:'AM-Matt',password:'matt123',role:'firefighter'}
  ],
  appliances:[
    {id:'P01',name:'P01',type:'Pump',station:'Oakenshire Fire Station',max:4},
    {id:'TTL01',name:'TTL01',type:'Turntable Ladder',station:'Oakenshire Fire Station',max:4},
    {id:'R01',name:'R01',type:'Rescue',station:'Oakenshire Fire Station',max:4}
  ],
  bookings:{},
  templates:[{
    id:'general',
    name:'General Incident Report',
    blocks:[
      {id:uid(),type:'heading',label:'Incident Details'},
      {id:uid(),type:'text',label:'Incident Number',required:true},
      {id:uid(),type:'status',label:'Incident Status',required:true},
      {id:uid(),type:'text',label:'Location',required:true},
      {id:uid(),type:'date',label:'Incident Date',required:true},
      {id:uid(),type:'time',label:'Incident Time',required:true},
      {id:uid(),type:'textarea',label:'Incident Description',required:true},
      {id:uid(),type:'pumps',label:'Attending Appliances'},
      {id:uid(),type:'firefighters',label:'Attending Firefighters'},
      {id:uid(),type:'image',label:'Incident Images'}
    ]
  }],
  reports:[],
  logo:null
};
let state=JSON.parse(localStorage.getItem(KEY)||'null')||defaultState;
let session=JSON.parse(localStorage.getItem(KEY+'_session')||'null');
let currentPage='dashboard', selectedBlock=null, editingTemplate=null;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function saveSession(){localStorage.setItem(KEY+'_session',JSON.stringify(session))}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function currentUser(){return session&&state.users.find(u=>u.id===session.id)}
function ensureDayReset(){
  const d=today(); if(state.bookings.date!==d){state.bookings={date:d,items:{}};save()}
}
function initials(n){return n.split(/[-_ ]/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function logoHtml(){return state.logo?`<img class="logo-img" src="${state.logo}" alt="Logo">`:`<div class="brandmark">OF</div>`}
function shell(){
  const u=currentUser();
  const root=document.getElementById('root');
  if(!root) return;
  if(!u){renderLogin();return}
  ensureDayReset();
  root.innerHTML=`<div class="app">
    <header class="topbar">
      <div class="brand">${logoHtml()}<span>Oakenshire Fire & Rescue<small>Duty Management</small></span></div>
      <nav class="nav">
        ${navBtn('dashboard','Dashboard')}
        ${navBtn('appliances','Appliances')}
        ${navBtn('reports','Incident Reports')}
        ${navBtn('myreports','My Reports')}
        ${u.role==='admin'?navBtn('admin','Admin'):''}
      </nav>
      <div class="userbox"><div class="avatar">${initials(u.username)}</div><div><strong>${esc(u.username)}</strong><span>${u.role==='admin'?'Administrator':'Firefighter'}</span></div><button class="btn secondary small" onclick="logout()">${ICONS.logout}Sign out</button></div>
    </header><main class="page" id="page"></main>
  </div>`;
  renderPage();
}
function navBtn(id,label){
 const ico={dashboard:ICONS.grid,appliances:ICONS.truck,reports:ICONS.report,myreports:ICONS.user,admin:ICONS.settings}[id]||'';
 return `<button class="${currentPage===id?'active':''}" onclick="go('${id}')">${ico}${label}</button>`;
}
function go(p){currentPage=p;selectedBlock=null;editingTemplate=null;shell()}
function logout(){session=null;saveSession();shell()}
function renderLogin(){
 document.getElementById('root').innerHTML=`<div class="login-wrap"><div class="card login">
  <div class="login-brand">${state.logo?`<img class="settings-logo" src="${state.logo}" alt="Logo">`:`<div class="brandmark">${ICONS.fire}</div>`}<h1>Oakenshire Fire & Rescue</h1><p>Duty Management System</p></div>
  <form onsubmit="login(event)"><div class="field"><label>Username</label><input id="loginUser" autocomplete="username" required></div><div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" required></div><button class="btn" style="width:100%">Sign in</button></form>
  <div style="text-align:center;margin-top:14px;font-size:12px;color:var(--muted)">Need an account? <button class="btn secondary small" onclick="showSignup()">${ICONS.plus}Sign up</button></div>
 </div></div>`;
}
function login(e){e.preventDefault();const u=state.users.find(x=>x.username===loginUser.value&&x.password===loginPass.value);if(!u){alert('Invalid username or password.');return}session={id:u.id};saveSession();currentPage='dashboard';shell()}
function showSignup(){
 document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal" style="max-width:450px"><div class="modal-head"><h2>Create account</h2><button class="close" onclick="closeModal()" aria-label="Close">${ICONS.close}</button></div>
 <form onsubmit="signup(event)"><div class="field"><label>Username</label><input id="suUser" required></div><div class="field"><label>Password</label><input id="suPass" type="password" required></div><div class="notice">New accounts are created as firefighter accounts. Administrator access is managed separately.</div><input id="suRole" type="hidden" value="firefighter"><button class="btn">Create account</button></form>
 </div></div>`;
}
function signup(e){e.preventDefault();const username=suUser.value.trim();if(state.users.some(u=>u.username.toLowerCase()===username.toLowerCase()))return alert('Username already exists.');const u={id:'u-'+uid(),username,password:suPass.value,role:suRole.value};state.users.push(u);save();session={id:u.id};saveSession();closeModal();currentPage='dashboard';shell()}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function renderPage(){const p=document.getElementById('page'); if(currentPage==='dashboard'||currentPage==='appliances')renderDashboard(p);else if(currentPage==='reports')renderReports(p);else if(currentPage==='myreports')renderMyReports(p);else if(currentPage==='admin')renderAdmin(p)}
function renderDashboard(p){
 ensureDayReset();const u=currentUser();const all=state.appliances;const cats=[['Pump',all.filter(a=>a.type==='Pump')],['Turntable Ladder',all.filter(a=>a.type==='Turntable Ladder')],['Rescue',all.filter(a=>a.type==='Rescue')],['Other',all.filter(a=>!['Pump','Turntable Ladder','Rescue'].includes(a.type))]].filter(x=>x[1].length);
 p.innerHTML=`<div class="pagehead"><div><h1>${currentPage==='appliances'?'Appliances':'Duty Dashboard'}</h1><div class="sub">${prettyDate(today())} · Daily appliance bookings reset automatically each day</div></div>${u.role==='admin'?'<button class="btn" onclick="openAddAppliance()">${ICONS.plus}Add appliance</button>':''}</div>
 <div class="grid3" style="margin-bottom:18px"><div class="card stat"><div class="label">Appliances</div><div class="num">${all.length}</div></div><div class="card stat"><div class="label">Crew signed on</div><div class="num">${crewCount()}</div></div><div class="card stat"><div class="label">Reports today</div><div class="num">${state.reports.filter(r=>r.date===today()).length}</div></div></div>
 ${cats.map(([cat,arr])=>`<section class="card section"><div class="section-title">${esc(cat)}</div><div class="appliance-list">${arr.map(applianceCard).join('')}</div></section>`).join('')||`<div class="card empty">No appliances configured.</div>`}`;
}
function crewCount(){return Object.values(state.bookings.items||{}).reduce((n,x)=>n+x.length,0)}
function applianceCard(a){
 const names=(state.bookings.items?.[a.id]||[]);const n=names.length;const status=n>=a.max?'full':n?'partial':'';
 const u=currentUser();const already=names.includes(u.username);
 return `<div class="appliance-card ${status}"><div class="appliance-meta"><div class="appliance-name">${esc(a.name)} <span class="type">(${esc(a.type)})</span></div><div class="appliance-line">${esc(a.station)} · ${n}/${a.max} crew</div><div class="crew">${n?esc(names.join(', ')):'Nobody booked yet'}</div></div>
 <div style="display:flex;gap:7px">${u.role==='admin'?`<button class="btn secondary small" onclick="editAppliance('${a.id}')">${ICONS.edit}Edit</button>`:''}<button class="btn small" ${already||n>=a.max?'disabled':''} onclick="book('${a.id}')">${already?'Booked On':n>=a.max?'Full':'Book On'}</button></div></div>`;
}
function book(id){ensureDayReset();const u=currentUser();state.bookings.items[id]??=[];if(!state.bookings.items[id].includes(u.username)){const a=state.appliances.find(x=>x.id===id);if(state.bookings.items[id].length<a.max)state.bookings.items[id].push(u.username)}save();renderPage()}
function openAddAppliance(existing=null){
 const a=existing||{id:'',name:'',type:'Pump',station:'Oakenshire Fire Station',max:4};
 document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal" style="max-width:520px"><div class="modal-head"><h2>${existing?'Edit appliance':'Add appliance'}</h2><button class="close" onclick="closeModal()" aria-label="Close">${ICONS.close}</button></div>
 <form onsubmit="saveAppliance(event,'${existing?'edit':'new'}','${esc(a.id)}')"><div class="field"><label>Appliance ID / Name</label><input id="apName" value="${esc(a.name)}" required></div><div class="field"><label>Type</label><select id="apType"><option ${a.type==='Pump'?'selected':''}>Pump</option><option ${a.type==='Turntable Ladder'?'selected':''}>Turntable Ladder</option><option ${a.type==='Rescue'?'selected':''}>Rescue</option><option ${a.type==='Other'?'selected':''}>Other</option></select></div><div class="field"><label>Station</label><input id="apStation" value="${esc(a.station)}" required></div><div class="field"><label>Maximum crew</label><input id="apMax" type="number" min="1" max="20" value="${a.max}" required></div><button class="btn">${existing?'Save changes':'Create appliance'}</button>${existing?` <button type="button" class="btn danger" onclick="deleteAppliance('${esc(a.id)}')">Delete</button>`:''}</form></div></div>`;
}
function saveAppliance(e,mode,id){e.preventDefault();const obj={id:mode==='new'?apName.value.trim().replace(/\s+/g,'-').toUpperCase():id,name:apName.value.trim(),type:apType.value,station:apStation.value.trim(),max:+apMax.value};if(mode==='new'){if(state.appliances.some(a=>a.id===obj.id))return alert('That appliance ID already exists.');state.appliances.push(obj)}else Object.assign(state.appliances.find(a=>a.id===id),obj);save();closeModal();renderPage()}
function editAppliance(id){openAddAppliance(state.appliances.find(a=>a.id===id))}
function deleteAppliance(id){if(!confirm('Delete this appliance?'))return;state.appliances=state.appliances.filter(a=>a.id!==id);delete state.bookings.items[id];save();closeModal();renderPage()}
function renderReports(p){
 const u=currentUser();
 if(u.role==='admin'){
  p.innerHTML=`<div class="pagehead"><div><h1>Incident Reports</h1><div class="sub">Create templates and review submitted operational reports.</div></div><button class="btn" onclick="newTemplate()">${ICONS.plus}Create template</button></div>
  <div class="grid2"><section class="card section"><div class="section-title">Report Templates</div>${state.templates.map(t=>`<div class="report-row"><div><strong>${esc(t.name)}</strong><small>${t.blocks.length} components</small></div><button class="btn secondary small" onclick="editTemplate('${t.id}')">Open builder</button></div>`).join('')}</section>
  <section class="card section"><div class="section-title">Submitted Reports</div>${state.reports.length?state.reports.slice().reverse().map(reportRow).join(''):`<div class="empty">No reports submitted yet.</div>`}</section></div>`;
 }else{
  p.innerHTML=`<div class="pagehead"><div><h1>Incident Reports</h1><div class="sub">Complete an administrator-created report template.</div></div><button class="btn" onclick="chooseTemplate()">${ICONS.plus}Create incident report</button></div>
  <div class="card section"><div class="section-title">Available templates</div>${state.templates.map(t=>`<div class="report-row"><div><strong>${esc(t.name)}</strong><small>${t.blocks.length} fields/components</small></div><button class="btn small" onclick="startReport('${t.id}')">Open</button></div>`).join('')||`<div class="empty">No report templates have been created.</div>`}</div>`;
 }
}
function reportRow(r){return `<div class="report-row"><div><strong>${esc(r.title||'Incident Report')}</strong><small>${esc(r.date)} · Submitted by ${esc(r.submittedBy)} · ${esc(r.appliance||'No appliance')}</small></div><button class="btn secondary small" onclick="viewReport('${r.id}')">View</button></div>`}
function renderMyReports(p){const u=currentUser();const rs=state.reports.filter(r=>r.submittedBy===u.username);p.innerHTML=`<div class="pagehead"><div><h1>My Reports</h1><div class="sub">Reports submitted under ${esc(u.username)}.</div></div><button class="btn" onclick="go('reports')">${ICONS.report}Create report</button></div><div class="card section">${rs.length?rs.slice().reverse().map(reportRow).join(''):`<div class="empty">You have not submitted any incident reports.</div>`}</div>`}
function chooseTemplate(){if(state.templates.length===1)return startReport(state.templates[0].id);document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h2>Select report template</h2><button class="close" onclick="closeModal()" aria-label="Close">${ICONS.close}</button></div>${state.templates.map(t=>`<div class="report-row"><div><strong>${esc(t.name)}</strong></div><button class="btn small" onclick="closeModal();startReport('${t.id}')">Use template</button></div>`).join('')}</div></div>`}
function startReport(id){
 const t=state.templates.find(x=>x.id===id);if(!t)return;
 document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal" style="max-width:820px"><div class="modal-head"><div><h2>${esc(t.name)}</h2><div class="sub">Complete all required fields before submitting.</div></div><button class="close" onclick="closeModal()" aria-label="Close">${ICONS.close}</button></div><form id="reportForm" class="report-form">${t.blocks.map(renderInputBlock).join('')}<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="submitReport(event,'${id}')">Submit report</button></div></form></div></div>`;
}
function renderInputBlock(b){
 if(b.type==='heading')return `<div style="padding:10px 0 4px"><h3>${esc(b.label)}</h3></div>`;
 const req=b.required?'required':'';
 if(b.type==='text')return `<div class="form-block"><label>${esc(b.label)}${b.required?' *':''}</label><input name="${b.id}" value="${esc(b.content||'')}" ${req}></div>`;
 if(b.type==='textarea')return `<div class="form-block"><label>${esc(b.label)}${b.required?' *':''}</label><textarea name="${b.id}" ${req}></textarea></div>`;
 if(b.type==='status')return `<div class="form-block"><label>${esc(b.label)}${b.required?' *':''}</label><select name="${b.id}" ${req}><option value="">Select status</option><option>Open</option><option>Ongoing</option><option>Under Control</option><option>Closed</option></select></div>`;
 if(b.type==='date')return `<div class="form-block"><label>${esc(b.label)}${b.required?' *':''}</label><input name="${b.id}" type="date" value="${today()}" ${req}></div>`;
 if(b.type==='time')return `<div class="form-block"><label>${esc(b.label)}${b.required?' *':''}</label><input name="${b.id}" type="time" value="${new Date().toTimeString().slice(0,5)}" ${req}></div>`;
 if(b.type==='image')return `<div class="form-block"><label>${esc(b.label)}</label>${b.src?`<img src="${b.src}" style="max-width:${b.width||180}px;max-height:${b.height||90}px;object-fit:contain;display:block;margin-bottom:9px">`:''}<input name="${b.id}" type="file" accept="image/*" multiple></div>`;
 if(b.type==='pumps')return `<div class="form-block"><label>${esc(b.label)}</label>${state.appliances.map(a=>`<label style="font-weight:500;margin:6px 0"><input type="checkbox" name="${b.id}" value="${esc(a.name)}" style="width:auto;margin-right:7px">${esc(a.name)} — ${esc(a.type)}</label>`).join('')}</div>`;
 if(b.type==='firefighters'){const users=state.users.filter(u=>u.role==='firefighter');return `<div class="form-block"><label>${esc(b.label)}</label>${users.map(u=>`<label style="font-weight:500;margin:6px 0"><input type="checkbox" name="${b.id}" value="${esc(u.username)}" style="width:auto;margin-right:7px">${esc(u.username)}</label>`).join('')}</div>`}
 return `<div class="form-block"><label>${esc(b.label)}${b.required?' *':''}</label><input name="${b.id}" ${req}></div>`;
}
async function submitReport(e,tid){
 e.preventDefault();const form=document.getElementById('reportForm');if(!form.checkValidity()){form.reportValidity();return}
 const t=state.templates.find(x=>x.id===tid);const data={};for(const b of t.blocks){if(b.type==='heading')continue;if(b.type==='image'){const input=form.querySelector(`[name="${b.id}"]`);data[b.id]={templateImage:b.src||null,files:[...input.files].map(f=>f.name)};continue}if(b.type==='pumps'||b.type==='firefighters')data[b.id]=[...form.querySelectorAll(`[name="${b.id}"]:checked`)].map(x=>x.value);else data[b.id]=form.elements[b.id]?.value||''}
 const u=currentUser();const booked=Object.entries(state.bookings.items||{}).find(([id,names])=>names.includes(u.username));
 state.reports.push({id:uid(),templateId:tid,title:t.name,date:today(),submittedAt:new Date().toISOString(),submittedBy:u.username,appliance:booked?state.appliances.find(a=>a.id===booked[0])?.name:'',data});
 save();closeModal();alert('Incident report submitted successfully.');go('myreports')
}
function viewReport(id){const r=state.reports.find(x=>x.id===id);if(!r)return;const t=state.templates.find(x=>x.id===r.templateId);document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><h2>${esc(r.title)}</h2><div class="sub">Submitted by ${esc(r.submittedBy)} · ${esc(r.date)} · ${esc(r.appliance||'No appliance')}</div></div><button class="close" onclick="closeModal()" aria-label="Close">${ICONS.close}</button></div>${t.blocks.map(b=>{if(b.type==='heading')return `<h3 style="margin-top:18px">${esc(b.label)}</h3>`;const val=r.data[b.id];return `<div class="form-block"><label>${esc(b.label)}</label><div style="font-size:13px;color:#56606a;white-space:pre-wrap">${Array.isArray(val)?esc(val.join(', ')||'None'):esc(val||'Not provided')}</div></div>`}).join('')}</div></div>`}
function newTemplate(){editingTemplate={id:'t-'+uid(),name:'New Incident Report',blocks:[]};renderBuilder()}
function editTemplate(id){editingTemplate=JSON.parse(JSON.stringify(state.templates.find(t=>t.id===id)));renderBuilder()}
const types={text:'Text Box',textarea:'Text Area',status:'Status',image:'Image Upload',pumps:'Attending Appliances',firefighters:'Attending Firefighters',date:'Date',time:'Time',heading:'Section Heading'};
function renderBuilder(){
 const t=editingTemplate;
 document.getElementById('page').innerHTML=`<div class="pagehead"><div><h1>Incident Report Builder</h1><div class="sub">Build a clean operational form. Drag fields into the report, then click a field to edit it.</div></div>
 <div class="toolbar"><button class="btn secondary" onclick="go('reports')">${ICONS.close}Cancel</button><button class="btn" onclick="saveTemplate()">${ICONS.save}Save template</button></div></div>
 <div class="card section" style="margin-bottom:14px"><div class="grid2"><div class="field" style="margin:0"><label>Template name</label><input value="${esc(t.name)}" oninput="editingTemplate.name=this.value"></div><div class="builder-note" style="align-self:end">Tip: add a Logo block, select it, upload an image, then set its width/height. Text blocks can be edited directly by selecting them.</div></div></div>
 <div class="builder">
  <div class="panel"><h3>Components</h3>
   ${Object.entries(types).map(([k,v])=>`<div class="palette-item" draggable="true" ondragstart="dragType(event,'${k}')">${({text:ICONS.text,textarea:ICONS.form,status:ICONS.form,image:ICONS.image,pumps:ICONS.truck,firefighters:ICONS.user,date:ICONS.form,time:ICONS.form,heading:ICONS.text}[k]||'')}${v}</div>`).join('')}
   <div class="notice" style="margin-top:10px"><b>Layout</b><br>Drag to add. Drag existing fields to reorder. Select a field to edit its label, content and image settings.</div>
  </div>
  <div class="canvas" ondragover="event.preventDefault()" ondrop="dropType(event)">
    <div class="canvas-toolbar"><strong style="font-size:12px">Report canvas</strong><span class="builder-note">${t.blocks.length} components</span></div>
    <div class="canvas-stage" id="canvas" ondragover="allowBlockReorder(event)" ondrop="dropBlockReorder(event)">${t.blocks.length?t.blocks.map(builderBlock).join(''):'<div class="drop-hint">Drop components here to start building the report</div>'}</div>
  </div>
  <div class="panel">${selectedBlock?propertiesPanel():`<h3>Template settings</h3><div class="builder-note">Select a component in the canvas to open its properties.</div><div style="margin-top:14px" class="template-actions"><button class="btn secondary small" onclick="addLogoBlock()">${ICONS.image}Add logo</button><button class="btn secondary small" onclick="addTextBlock()">${ICONS.text}Add text</button></div>`}</div>
 </div>`;
}
function builderBlock(b){
 const content=b.type==='heading'?`<h3>${esc(b.label)}</h3>`:
 b.type==='text'?`<div class="text-insert">${esc(b.content||'Click to edit text…')}</div>`:
 b.type==='image'?`<div class="image-drop">${b.src?`<img src="${b.src}" style="max-width:${b.width||180}px;max-height:${b.height||110}px;object-fit:contain;border-radius:6px">`:`${ICONS.upload} Click field to upload an image/logo`}</div>`:
 `<div class="preview">${b.type==='pumps'?'[ Appliance selector ]':b.type==='firefighters'?'[ Firefighter selector ]':b.type==='status'?'[ Status dropdown ]':'[ Input field ]'}</div>`;
 return `<div data-id="${b.id}" class="block ${selectedBlock===b.id?'selected':''}" draggable="true" ondragstart="dragBlock(event,'${b.id}')" ondragend="dragEnd()" onclick="selectBlock('${b.id}')">
   <span class="move-handle">${ICONS.drag}</span><div class="block-type">${types[b.type]}</div><label>${esc(b.label)}</label>${content}
 </div>`;
}
function addLogoBlock(){const b={id:uid(),type:'image',label:'Logo / Image',required:false,src:null,width:180,height:90};editingTemplate.blocks.push(b);selectedBlock=b.id;renderBuilder()}
function addTextBlock(){const b={id:uid(),type:'text',label:'Text',content:'Enter your text here…',required:false};editingTemplate.blocks.push(b);selectedBlock=b.id;renderBuilder()}
function propertiesPanel(){
 const b=editingTemplate.blocks.find(x=>x.id===selectedBlock);if(!b)return'';
 return `<h3>Field properties</h3>
 <div class="field"><label>Label</label><input value="${esc(b.label)}" oninput="updateBlock('label',this.value)"></div>
 <div class="field"><label>Component</label><select onchange="updateBlock('type',this.value)">${Object.entries(types).map(([k,v])=>`<option value="${k}" ${b.type===k?'selected':''}>${v}</option>`).join('')}</select></div>
 ${b.type==='text'?`<div class="field"><label>Text content</label><textarea oninput="updateBlock('content',this.value)">${esc(b.content||'')}</textarea><div class="builder-note">This text is part of the saved template. Firefighters can also edit text fields when completing a report.</div></div>`:''}
 ${b.type==='image'?`<div class="field"><label>Image / logo</label><input type="file" accept="image/*" onchange="uploadBuilderImage(event)"></div>
   ${b.src?`<div class="field"><label>Width (px)</label><input type="number" min="30" max="700" value="${b.width||180}" oninput="updateBlock('width',+this.value)"></div>
   <div class="field"><label>Height (px)</label><input type="number" min="30" max="500" value="${b.height||90}" oninput="updateBlock('height',+this.value)"></div>
   <div class="builder-note">Upload a logo or image, then adjust its size. The field can be repositioned by dragging it within the report.</div>`:''}`:''}
 ${b.type!=='heading'&&b.type!=='image'&&b.type!=='text'?`<label style="font-size:12px;font-weight:750"><input type="checkbox" style="width:auto;margin-right:7px" ${b.required?'checked':''} onchange="updateBlock('required',this.checked)"> Required field</label>`:''}
 <div style="margin-top:18px"><button class="btn danger small" onclick="removeBlock()">${ICONS.trash}Delete component</button></div>`;
}
function dragType(e,type){e.dataTransfer.setData('newType',type)}
function dropType(e){
 e.preventDefault();
 const type=e.dataTransfer.getData('newType');
 if(type){
   const b={id:uid(),type,label:types[type],required:false};
   if(type==='text')b.content='Click to edit text…';
   if(type==='image'){b.src=null;b.width=180;b.height=90}
   editingTemplate.blocks.push(b);selectedBlock=b.id;renderBuilder();
 }
}
function dragBlock(e,id){e.dataTransfer.setData('blockId',id);e.currentTarget.classList.add('dragging')}
function dragEnd(){document.querySelectorAll('.block.dragging').forEach(x=>x.classList.remove('dragging'))}
function selectBlock(id){selectedBlock=id;renderBuilder()}
function updateBlock(k,v){const b=editingTemplate.blocks.find(x=>x.id===selectedBlock);if(b){b[k]=v;renderBuilder()}}
function uploadBuilderImage(e){
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();r.onload=()=>{const b=editingTemplate.blocks.find(x=>x.id===selectedBlock);b.src=r.result;selectedBlock=b.id;renderBuilder();toast('Image added to the template')};r.readAsDataURL(f);
}
function removeBlock(){editingTemplate.blocks=editingTemplate.blocks.filter(x=>x.id!==selectedBlock);selectedBlock=null;renderBuilder()}

function allowBlockReorder(e){if(e.dataTransfer.types.includes('text/plain'))e.preventDefault()}
function dropBlockReorder(e){
 e.preventDefault();
 const id=e.dataTransfer.getData('blockId'); if(!id)return;
 const target=e.target.closest('.block');
 const from=editingTemplate.blocks.findIndex(x=>x.id===id);
 if(from<0)return;
 if(target){
   const to=editingTemplate.blocks.findIndex(x=>x.id===target.dataset.id);
   if(to>=0 && to!==from){const [item]=editingTemplate.blocks.splice(from,1);editingTemplate.blocks.splice(to,0,item);}
 } else {
   const [item]=editingTemplate.blocks.splice(from,1);editingTemplate.blocks.push(item);
 }
 renderBuilder();
}
function saveTemplate(){if(!editingTemplate.name.trim())return alert('Enter a template name.');const i=state.templates.findIndex(t=>t.id===editingTemplate.id);if(i>=0)state.templates[i]=editingTemplate;else state.templates.push(editingTemplate);save();editingTemplate=null;selectedBlock=null;go('reports')}
function renderAdmin(p){
 p.innerHTML=`<div class="pagehead"><div><h1>Administration</h1><div class="sub">Manage appliances, users, templates and branding.</div></div></div>
 <div class="grid3"><div class="card stat"><div class="label">Users</div><div class="num">${state.users.length}</div></div><div class="card stat"><div class="label">Appliances</div><div class="num">${state.appliances.length}</div></div><div class="card stat"><div class="label">Reports</div><div class="num">${state.reports.length}</div></div></div>
 <div class="grid2" style="margin-top:18px"><section class="card section"><div class="section-title">Appliance management</div><button class="btn small" onclick="openAddAppliance()">+ Add appliance</button><div style="margin-top:12px">${state.appliances.map(a=>`<div class="report-row"><div><strong>${esc(a.name)}</strong><small>${esc(a.type)} · ${esc(a.station)} · max ${a.max}</small></div><button class="btn secondary small" onclick="editAppliance('${a.id}')">${ICONS.edit}Edit</button></div>`).join('')}</div></section>
 <section class="card section"><div class="section-title">Users</div>${state.users.map(u=>`<div class="report-row"><div><strong>${esc(u.username)}</strong><small>${u.role}</small></div><span class="badge ${u.role==='admin'?'green':''}">${u.role}</span></div>`).join('')}</section></div>
 <section class="card section" style="margin-top:18px"><div class="section-title">Branding</div><div class="grid2"><div><p class="sub">Upload your Oakenshire logo for the prototype. It is stored locally in this browser.</p><input type="file" accept="image/*" onchange="uploadLogo(event)"></div><div>${state.logo?`<img class="settings-logo" src="${state.logo}"><br><button class="btn danger small" style="margin-top:8px" onclick="removeLogo()">${ICONS.trash}Remove logo</button>`:`<div class="sub">No custom logo uploaded.</div>`}</div></div></section>`;
}
function uploadLogo(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.logo=r.result;save();shell()};r.readAsDataURL(f)}
function removeLogo(){state.logo=null;save();shell()}
shell();
</script>
</body>
</html>
